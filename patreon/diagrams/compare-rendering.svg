<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><rect width="1400" height="790" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">A frame, then and now</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Same goal: many lights in dark corridors. The new frame is much simpler today, and it has not earned the comparison yet.</text><rect x="30" y="120" width="660" height="630" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="55" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2b84b" text-anchor="start">Old Daidalos: deferred shading on DirectX 9</text><rect x="55" y="178" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="203" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Fill</text><text x="75" y="225" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">color, normal, specular, depth into 4 textures</text><rect x="55" y="246" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="271" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Spot lights</text><text x="75" y="293" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">shadow map if it casts one, then one draw per light</text><rect x="55" y="314" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="339" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Point lights</text><text x="75" y="361" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">one draw per light, limited to its area on screen</text><rect x="55" y="382" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="407" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Directional lights</text><text x="75" y="429" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">shadow map if it casts one, then one draw per light</text><rect x="55" y="450" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="475" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Combine</text><text x="75" y="497" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">color × accumulated light</text><rect x="55" y="518" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="543" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Post-processing</text><text x="75" y="565" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">glow and blur</text><rect x="55" y="586" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="611" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Skybox</text><text x="75" y="633" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">drawn behind what is already there</text><rect x="55" y="654" width="610" height="58" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="75" y="679" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Transparent, particles</text><text x="75" y="701" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">a second, forward path</text><rect x="710" y="120" width="660" height="630" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="735" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb68b" text-anchor="start">Daidalos Engine Next: forward on Vulkan 1.3</text><text x="735" y="192" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#3fb68b" text-anchor="start">Today</text><rect x="735" y="206" width="610" height="58" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="1.5"/><text x="755" y="231" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Mesh pass</text><text x="755" y="253" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">every mesh, fixed light, fog</text><rect x="735" y="274" width="610" height="58" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="1.5"/><text x="755" y="299" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Overlay</text><text x="755" y="321" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">debug interface</text><text x="735" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3adbf" text-anchor="start">Phase 7, not written yet</text><rect x="735" y="380" width="610" height="58" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="755" y="405" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3adbf" text-anchor="start">Depth and normals</text><text x="755" y="427" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">a quick first pass</text><rect x="735" y="448" width="610" height="58" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="755" y="473" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3adbf" text-anchor="start">Clusters</text><text x="755" y="495" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">the view cut into cells, each with its light list</text><rect x="735" y="516" width="610" height="58" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="755" y="541" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3adbf" text-anchor="start">Ambient occlusion</text><text x="755" y="563" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">contact shadows, from the first pass</text><rect x="735" y="584" width="610" height="58" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="755" y="609" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#a3adbf" text-anchor="start">PBR shading, then transparency</text><text x="755" y="631" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">one material path for both</text></svg>
