<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">From a file on disk to a pixel on screen</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">The left half knows nothing about Vulkan, so it can be tested without a graphics card.</text><rect x="30" y="120" width="610" height="400" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="55" y="156" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#3fb68b" text-anchor="start">resources: plain CPU data</text><rect x="660" y="120" width="710" height="400" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="685" y="156" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#5aa2f0" text-anchor="start">renderer: GPU objects</text><rect x="55" y="190" width="250" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="180.0" y="228" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Lantern.gltf</text><text x="180.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">geometry, materials, nodes</text><rect x="55" y="310" width="250" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="180.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">wall_baseColor.png</text><text x="180.0" y="376" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">or KTX2, transcoded to BC7</text><rect x="350" y="190" width="260" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="480.0" y="228" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">ModelData</text><text x="480.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">meshes, material values</text><rect x="350" y="310" width="260" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="480.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">ImageData</text><text x="480.0" y="376" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">pixels with a mip chain</text><line x1="307" y1="236" x2="348" y2="236" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="307" y1="356" x2="348" y2="356" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="190" width="300" height="92" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="1.5"/><text x="840.0" y="228" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">AssetLibrary</text><text x="840.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">loads each asset once, owns it</text><rect x="690" y="310" width="300" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="840.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Instantiate</text><text x="840.0" y="376" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">one entity per node of the model</text><rect x="1040" y="190" width="300" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1190.0" y="228" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Vulkan buffers, textures</text><text x="1190.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">vertices, indices, bindless slots</text><rect x="1040" y="310" width="300" height="92" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1190.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">ECS entities</text><text x="1190.0" y="376" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">transforms and MeshRenderers</text><line x1="612" y1="236" x2="688" y2="236" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="612" y1="356" x2="660" y2="356" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="660" y1="356" x2="660" y2="262" stroke="#a3adbf" stroke-width="2"/><line x1="660" y1="262" x2="688" y2="262" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="992" y1="236" x2="1038" y2="236" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="840" y1="282" x2="840" y2="308" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="992" y1="356" x2="1038" y2="356" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="438" width="1285" height="62" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="80" y="476" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#eef1f6" text-anchor="start">Cached by identity: &#x27;models\wall.png&#x27; and &#x27;./models/wall.png&#x27; are one asset, and a texture shared by two models loads once.</text><rect x="30" y="540" width="1340" height="66" rx="10" fill="#1f2430" stroke="#ef7a6a" stroke-width="1.5"/><text x="55" y="580" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#eef1f6" text-anchor="start">Missing or broken file: the load fails with an error that names it. No magenta placeholder quietly hides the problem.</text></svg>
