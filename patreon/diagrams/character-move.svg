<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660"><rect width="1400" height="660" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">One step of walking, 60 times per second</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">The game decides where the player wants to go. Jolt decides how far the world lets them.</text><rect x="50" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="205.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Wish</text><text x="205.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">keys become a direction,</text><text x="205.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">speed from walk, run, crouch</text><line x1="362" y1="196" x2="378" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="535.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Gravity</text><text x="535.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">added by the game,</text><text x="535.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">skipped on a ladder</text><line x1="692" y1="196" x2="708" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="710" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="865.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Move the capsule</text><text x="865.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">Jolt sweeps it through</text><text x="865.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">the level and the doors</text><line x1="1022" y1="196" x2="1038" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1040" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="1195.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Measure</text><text x="1195.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">real speed = distance moved</text><text x="1195.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">÷ time of the step</text><text x="205" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#5aa2f0" text-anchor="middle">game code</text><text x="865" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb68b" text-anchor="middle">physics module</text><rect x="50" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="205.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Walls</text><text x="205.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">Slide along them</text><text x="205.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">instead of stopping dead</text><rect x="380" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="535.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Steps</text><text x="535.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">Climbed up to 0.4 m</text><text x="535.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">with no jump needed</text><rect x="710" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="865.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Slopes</text><text x="865.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">Walkable up to 50°</text><text x="865.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">steeper ones are walls</text><rect x="1040" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1195.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">Doors</text><text x="1195.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">Boxes that move</text><text x="1195.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">with their animation</text><rect x="50" y="492" width="1300" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="80" y="532" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef1f6" text-anchor="start">What the capsule moves through</text><text x="80" y="568" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">The factory&#x27;s visible level, 10,282 triangles, is also its collision mesh. There is no separate invisible version to keep in step.</text><text x="80" y="596" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">The capsule is 1.7 m tall and 0.35 m in radius, and shrinks to 0.9 m when crouching. It only stands up if there is room.</text></svg>
