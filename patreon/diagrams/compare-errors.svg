<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">When a file is missing, then and now</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">The old engine threw exceptions. The new one returns failure as a value.</text><rect x="40" y="120" width="650" height="460" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="65" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2b84b" text-anchor="start">Old Daidalos</text><rect x="65" y="178" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="85" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Loader</text><text x="85" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">throw CExceptionLoad(filename)</text><line x1="365" y1="247" x2="365" y2="265" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="266" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="85" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Each function in between</text><text x="85" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">looks as if nothing can go wrong</text><line x1="365" y1="335" x2="365" y2="353" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="354" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="85" y="384" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">No catch anywhere in the game path</text><text x="85" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">only the thread pool catches anything</text><line x1="365" y1="423" x2="365" y2="441" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="442" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="85" y="472" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">The program stops</text><text x="85" y="496" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">an uncaught exception ends it</text><text x="65" y="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Nothing in a function&#x27;s signature says that it can fail.</text><rect x="710" y="120" width="650" height="460" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="735" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb68b" text-anchor="start">Daidalos Engine Next</text><rect x="735" y="178" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="755" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Loader</text><text x="755" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">return tl::unexpected(Error{NotFound, module, message})</text><line x1="1035" y1="247" x2="1035" y2="265" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="266" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="755" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Result&lt;Model*&gt;</text><text x="755" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">each caller must look before using the value</text><line x1="1035" y1="335" x2="1035" y2="353" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="354" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="755" y="384" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">The caller decides</text><text x="755" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">report, retry, or pass it up with more context</text><line x1="1035" y1="423" x2="1035" y2="441" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="735" y="442" width="600" height="68" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="755" y="472" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Startup failed? Roll back</text><text x="755" y="496" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a3adbf" text-anchor="start">started steps stop in reverse order</text><text x="735" y="554" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">The signature says it: this call can fail, and here is what you get.</text></svg>
