<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">A door, then and now</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">On the left, a door is a kind of something. On the right, a door is a list of parts.</text><rect x="30" y="120" width="620" height="600" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="55" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2b84b" text-anchor="start">Old Daidalos: a family tree</text><rect x="225" y="186" width="170" height="54" rx="10" fill="#1f2430" stroke="#f2b84b" stroke-width="1.5"/><text x="310.0" y="220" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">IEntity</text><text x="405" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="start">health, particles,</text><text x="405" y="228" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="start">id, flag...</text><rect x="70" y="286" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="180.0" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">ICollidableEntity</text><rect x="350" y="286" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">ITriggerEntity</text><line x1="285" y1="241" x2="190" y2="284" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="335" y1="241" x2="450" y2="284" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="376" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="180.0" y="410" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">IEnemyEntity</text><line x1="180" y1="341" x2="180" y2="374" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="466" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="180.0" y="500" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">CZombieEntity</text><line x1="180" y1="431" x2="180" y2="464" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="376" width="220" height="54" rx="10" fill="#1f2430" stroke="#f2b84b" stroke-width="1.5"/><text x="460.0" y="410" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">CDoorEntity</text><rect x="350" y="442" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="476" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">CLadderEntity</text><rect x="350" y="508" width="220" height="54" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="542" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#eef1f6" text-anchor="middle">CHandgunAmmoEntity</text><line x1="450" y1="341" x2="450" y2="374" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="590" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">...and 21 entity classes in all</text><text x="55" y="640" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">A door inherits a health value it has no use for,</text><text x="55" y="666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">and each new mix of abilities needs a new place in the tree.</text><rect x="670" y="120" width="700" height="600" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="695" y="158" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb68b" text-anchor="start">Daidalos Engine Next: a table</text><text transform="translate(832,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Transform</text><text transform="translate(902,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Mesh</text><text transform="translate(972,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Door</text><text transform="translate(1042,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Body</text><text transform="translate(1112,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Pickup</text><text transform="translate(1182,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Ladder</text><text transform="translate(1252,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Camera</text><text transform="translate(1322,232) rotate(-38)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#a3adbf">Player</text><text x="695" y="292" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Door</text><rect x="796" y="250" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="866" y="250" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="936" y="250" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="1006" y="250" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="1076" y="250" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1146" y="250" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1216" y="250" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1286" y="250" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><text x="695" y="368" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Pickup</text><rect x="796" y="326" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="866" y="326" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="936" y="326" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1006" y="326" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1076" y="326" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="1146" y="326" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1216" y="326" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1286" y="326" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><text x="695" y="444" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Ladder</text><rect x="796" y="402" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="866" y="402" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="936" y="402" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1006" y="402" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1076" y="402" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1146" y="402" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="1216" y="402" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1286" y="402" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><text x="695" y="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef1f6" text-anchor="start">Player</text><rect x="796" y="478" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="866" y="478" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="936" y="478" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1006" y="478" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1076" y="478" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1146" y="478" width="58" height="62" rx="6" fill="#14171f" stroke="#262c3a" stroke-width="1.5"/><rect x="1216" y="478" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><rect x="1286" y="478" width="58" height="62" rx="6" fill="#21403a" stroke="#3fb68b" stroke-width="1.5"/><text x="695" y="588" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Entities are only numbers. Any mix of components is allowed,</text><text x="695" y="614" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">and giving a crate a health value later touches no other class.</text><text x="695" y="666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Zombies join this table in Phase 6.</text></svg>
