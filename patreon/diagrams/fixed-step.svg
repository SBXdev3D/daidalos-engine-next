<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">Two clocks: the world&#x27;s and the screen&#x27;s</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">The world ticks at a steady 60 Hz. The screen draws whenever it can, and shows the moment between two ticks.</text><text x="50" y="196" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef1f6" text-anchor="start">Fixed steps</text><line x1="150" y1="190" x2="1350" y2="190" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><circle cx="170" cy="190" r="9" fill="#3fb68b"/><text x="170" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">0.0</text><circle cx="335" cy="190" r="9" fill="#3fb68b"/><text x="335" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">16.7</text><circle cx="500" cy="190" r="9" fill="#3fb68b"/><text x="500" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">33.3</text><circle cx="665" cy="190" r="9" fill="#3fb68b"/><text x="665" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">50.0</text><circle cx="830" cy="190" r="9" fill="#3fb68b"/><text x="830" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">66.7</text><circle cx="995" cy="190" r="9" fill="#3fb68b"/><text x="995" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">83.3</text><circle cx="1160" cy="190" r="9" fill="#3fb68b"/><text x="1160" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="middle">100.0</text><text x="1270" y="170" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3adbf" text-anchor="start">ms</text><text x="50" y="306" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#eef1f6" text-anchor="start">Frames</text><line x1="150" y1="300" x2="1350" y2="300" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="158.0" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="170.0" y1="282" x2="170.0" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="290.0" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="302.0" y1="282" x2="302.0" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="405.5" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="417.5" y1="282" x2="417.5" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="719.0" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="731.0" y1="282" x2="731.0" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="867.5" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="879.5" y1="282" x2="879.5" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="1082.0" y="284" width="24" height="32" rx="4" fill="#5aa2f0" stroke="#5aa2f0" stroke-width="1.5"/><line x1="1094.0" y1="282" x2="1094.0" y2="204" stroke="#3a4254" stroke-width="1.5" stroke-dasharray="6 5"/><text x="574.25" y="344" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#ef7a6a" text-anchor="middle">a slow frame: two steps to catch up</text><rect x="50" y="376" width="640" height="224" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="76" y="416" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="start">Worked example: a frame took 40 ms</text><text x="76" y="454" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef1f6" text-anchor="start">With nothing owed before, 40 ms are now owed.</text><text x="76" y="484" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef1f6" text-anchor="start">Two steps of 16.7 ms fit, so the world ticks twice.</text><text x="76" y="514" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef1f6" text-anchor="start">6.7 ms stay in the account for the next frame.</text><text x="76" y="544" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef1f6" text-anchor="start">6.7 ÷ 16.7 = 0.4: the screen is 40% of the way</text><text x="76" y="570" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#eef1f6" text-anchor="start">from the last position to the current one.</text><rect x="710" y="376" width="640" height="224" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="736" y="416" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="start">What the camera draws</text><line x1="790" y1="490" x2="1270" y2="490" stroke="#a3adbf" stroke-width="3"/><circle cx="790" cy="490" r="11" fill="#3fb68b"/><circle cx="1270" cy="490" r="11" fill="#3fb68b"/><circle cx="982.0" cy="490" r="11" fill="#5aa2f0"/><text x="790" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">previous step</text><text x="1270" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">latest step</text><text x="982.0" y="462" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#5aa2f0" text-anchor="middle">drawn: 0.4</text><text x="736" y="548" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">Smooth on any monitor, at the price of showing</text><text x="736" y="574" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">the player up to one step (16.7 ms) in the past.</text></svg>
