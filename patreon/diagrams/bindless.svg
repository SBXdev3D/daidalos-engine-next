<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><rect width="1400" height="560" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">How one draw finds its data</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">The draw carries five small numbers. The GPU follows them to everything else.</text><rect x="50" y="130" width="330" height="370" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="215" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Push constants</text><text x="215" y="198" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">20 bytes, set for each draw</text><rect x="80" y="218" width="270" height="42" rx="6" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><text x="215" y="245" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#eef1f6" text-anchor="middle">frame table</text><rect x="80" y="270" width="270" height="42" rx="6" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><text x="215" y="297" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#eef1f6" text-anchor="middle">instance table</text><rect x="80" y="322" width="270" height="42" rx="6" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><text x="215" y="349" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#eef1f6" text-anchor="middle">instance number</text><rect x="80" y="374" width="270" height="42" rx="6" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><text x="215" y="401" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#eef1f6" text-anchor="middle">material table</text><rect x="80" y="426" width="270" height="42" rx="6" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><text x="215" y="453" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#eef1f6" text-anchor="middle">material number</text><rect x="520" y="130" width="420" height="106" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="730" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">FrameData</text><text x="730" y="204" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">view-projection matrix, camera, fog</text><rect x="520" y="262" width="420" height="106" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="730" y="306" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">InstanceData</text><text x="730" y="336" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">world matrix of this draw</text><rect x="520" y="394" width="420" height="106" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="730" y="438" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">MaterialData</text><text x="730" y="468" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">factors and texture numbers</text><line x1="351" y1="239" x2="518" y2="183" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="351" y1="317" x2="518" y2="315" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="351" y1="421" x2="518" y2="447" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1060" y="262" width="290" height="238" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="1205" y="304" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">All textures</text><text x="1205" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">one big array</text><text x="1205" y="356" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">up to 4096</text><rect x="1086" y="376" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1134" y="376" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1182" y="376" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1230" y="376" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1278" y="376" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1086" y="412" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1134" y="412" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1182" y="412" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1230" y="412" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1278" y="412" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1086" y="448" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1134" y="448" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1182" y="448" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1230" y="448" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><rect x="1278" y="448" width="42" height="30" rx="4" fill="#1a2030" stroke="#3a4254" stroke-width="1.5"/><line x1="941" y1="447" x2="1058" y2="420" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/></svg>
