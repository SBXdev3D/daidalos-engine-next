<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">The render pipeline today</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Deliberately small: one pass for the world, one for the debug overlay. Phase 7 fills in the dashed part.</text><rect x="50" y="130" width="240" height="158" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="2"/><text x="170.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">ECS</text><text x="170.0" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">entities with</text><text x="170.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">WorldTransform and</text><text x="170.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">MeshRenderer</text><line x1="292" y1="209" x2="314" y2="209" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="130" width="240" height="158" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="436.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Extract</text><text x="436.0" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">copied into a</text><text x="436.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">SceneView: camera,</text><text x="436.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">fog, draw list</text><line x1="558" y1="209" x2="580" y2="209" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="582" y="130" width="240" height="158" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="702.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Mesh pass</text><text x="702.0" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">one draw per item,</text><text x="702.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">depth test, reverse-Z,</text><text x="702.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">materials</text><line x1="824" y1="209" x2="846" y2="209" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="848" y="130" width="240" height="158" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="968.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Overlay</text><text x="968.0" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">Dear ImGui, in</text><text x="968.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">development</text><text x="968.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">builds</text><line x1="1090" y1="209" x2="1112" y2="209" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1114" y="130" width="240" height="158" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="2"/><text x="1234.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Present</text><text x="1234.0" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">the finished image</text><text x="1234.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">goes to the</text><text x="1234.0" y="256" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">screen</text><rect x="30" y="322" width="1340" height="150" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="55" y="358" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef1f6" text-anchor="start">Inside the shader, for each pixel of each mesh</text><rect x="55" y="376" width="300" height="76" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="205" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#eef1f6" text-anchor="middle">Base color</text><text x="205" y="434" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">texture × factor</text><line x1="356" y1="414" x2="378" y2="414" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="376" width="300" height="76" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="530" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#eef1f6" text-anchor="middle">Cut-out</text><text x="530" y="434" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">discard if see-through</text><line x1="681" y1="414" x2="703" y2="414" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="376" width="300" height="76" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="855" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#eef1f6" text-anchor="middle">Fake light</text><text x="855" y="434" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">one fixed direction</text><line x1="1006" y1="414" x2="1028" y2="414" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1030" y="376" width="300" height="76" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1180" y="408" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#eef1f6" text-anchor="middle">Fog</text><text x="1180" y="434" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">fades with distance</text><rect x="30" y="506" width="1340" height="158" rx="12" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="55" y="542" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#a3adbf" text-anchor="start">Planned for Phase 7</text><rect x="55" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="155" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">Depth and normals</text><rect x="272" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="372" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">Light clustering</text><rect x="489" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="589" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">Ambient occlusion</text><rect x="706" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="806" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">PBR shading</text><rect x="923" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1023" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">Transparency</text><rect x="1140" y="562" width="200" height="72" rx="10" fill="#14171f" stroke="#6c7a94" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1240" y="604" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#a3adbf" text-anchor="middle">Post-processing</text></svg>
