<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">How a zombie moves</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Animation only moves invisible joints. The graphics card bends the skin to follow them.</text><rect x="50" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="205.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Clips</text><text x="205.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">keys read from the model:</text><text x="205.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">wait, walk, attack, die</text><line x1="362" y1="196" x2="378" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="380" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="535.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Animator</text><text x="535.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">plays one clip, and fades</text><text x="535.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">the previous one out</text><line x1="692" y1="196" x2="708" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="710" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="865.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Joints</text><text x="865.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">ordinary entities, placed</text><text x="865.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">by the transform pass</text><line x1="1022" y1="196" x2="1038" y2="196" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1040" y="130" width="310" height="132" rx="10" fill="#1f2430" stroke="#3fb68b" stroke-width="2"/><text x="1195.0" y="172" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Vertex shader</text><text x="1195.0" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">each vertex follows up to</text><text x="1195.0" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">four joints, by weight</text><text x="380" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#5aa2f0" text-anchor="middle">processor, once per frame</text><text x="1040" y="296" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#3fb68b" text-anchor="middle">graphics card, for every vertex</text><rect x="50" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="205.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">19 joints</text><text x="205.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">in the zombie&#x27;s skeleton,</text><text x="205.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">each one an entity</text><rect x="380" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="535.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">735 triangles</text><text x="535.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">bent on the graphics card,</text><text x="535.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">never rewritten</text><rect x="710" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="865.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">4 clips</text><text x="865.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">cut from one long timeline</text><text x="865.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">at the old frame ranges</text><rect x="1040" y="326" width="310" height="132" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1195.0" y="366" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">0.3 s</text><text x="1195.0" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="middle">to fade from one clip</text><text x="1195.0" y="426" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">to the next</text><rect x="50" y="492" width="1300" height="110" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="80" y="532" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">Then: the old engine bent every vertex on the processor, for every frame of every clip, at load time.</text><text x="80" y="564" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">Now: the converter reproduces the old math, checks the vertices of each clip against it, and saves standard glTF files.</text></svg>
