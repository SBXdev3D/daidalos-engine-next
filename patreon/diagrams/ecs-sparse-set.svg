<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">One component type, one sparse set</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Example with the Door component: entities 1, 5 and 3 have one. The others do not.</text><text x="50" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="start">Sparse array</text><text x="50" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="start">Indexed by entity.</text><text x="50" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="start">Holds a position.</text><rect x="300" y="150" width="64" height="52" rx="4" fill="#14171f" stroke="#3a4254" stroke-width="1.5"/><text x="332.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle"></text><text x="332.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">0</text><rect x="364" y="150" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="396.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">0</text><text x="396.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">1</text><rect x="428" y="150" width="64" height="52" rx="4" fill="#14171f" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle"></text><text x="460.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">2</text><rect x="492" y="150" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="524.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">2</text><text x="524.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">3</text><rect x="556" y="150" width="64" height="52" rx="4" fill="#14171f" stroke="#3a4254" stroke-width="1.5"/><text x="588.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle"></text><text x="588.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">4</text><rect x="620" y="150" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="652.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">1</text><text x="652.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">5</text><rect x="684" y="150" width="64" height="52" rx="4" fill="#14171f" stroke="#3a4254" stroke-width="1.5"/><text x="716.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle"></text><text x="716.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">6</text><rect x="748" y="150" width="64" height="52" rx="4" fill="#14171f" stroke="#3a4254" stroke-width="1.5"/><text x="780.0" y="183.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle"></text><text x="780.0" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">7</text><text x="840" y="182" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Question: does entity 5 have a door?</text><text x="840" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Answer in one array read.</text><text x="50" y="294" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="start">Dense arrays</text><text x="50" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="start">Packed side by side,</text><text x="50" y="342" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="start">with no holes.</text><rect x="300" y="276" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="332.0" y="309.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">1</text><text x="332.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">0</text><rect x="364" y="276" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="396.0" y="309.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">5</text><text x="396.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">1</text><rect x="428" y="276" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="309.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">3</text><text x="460.0" y="348" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle">2</text><rect x="300" y="356" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="332.0" y="389.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">A</text><text x="332.0" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle"></text><rect x="364" y="356" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="396.0" y="389.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">B</text><text x="396.0" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle"></text><rect x="428" y="356" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="460.0" y="389.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">C</text><text x="460.0" y="428" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#a3adbf" text-anchor="middle"></text><text x="516" y="308" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">entities</text><text x="516" y="388" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">Door components</text><text x="840" y="306" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">A system walks these from left to right,</text><text x="840" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">so the CPU reads memory in order,</text><text x="840" y="354" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">which is what it does fastest.</text><rect x="30" y="450" width="1340" height="270" rx="12" fill="#181c26" stroke="#262c3a" stroke-width="1.5"/><text x="55" y="490" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#ef7a6a" text-anchor="start">Removing the door of entity 1: swap and pop</text><text x="55" y="520" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">The hole is filled by the last element, so the array stays packed.</text><rect x="80" y="560" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="112.0" y="593.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">1</text><rect x="144" y="560" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="176.0" y="593.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">5</text><rect x="208" y="560" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="240.0" y="593.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">3</text><rect x="80" y="620" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="112.0" y="653.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">A</text><rect x="144" y="620" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="176.0" y="653.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">B</text><rect x="208" y="620" width="64" height="52" rx="4" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="240.0" y="653.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">C</text><text x="80" y="696" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="start">before</text><line x1="310" y1="616" x2="430" y2="616" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><text x="370" y="600" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="middle">C moves</text><rect x="450" y="560" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="482.0" y="593.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">3</text><rect x="514" y="560" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="546.0" y="593.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">5</text><rect x="450" y="620" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="482.0" y="653.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">C</text><rect x="514" y="620" width="64" height="52" rx="4" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="546.0" y="653.0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#eef1f6" text-anchor="middle">B</text><text x="450" y="696" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="start">after</text><text x="680" y="590" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="500" fill="#eef1f6" text-anchor="start">Only two entries of the sparse array change:</text><text x="680" y="624" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">entity 3 now points to position 0</text><text x="680" y="650" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">entity 1 is marked as absent</text><text x="680" y="684" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">No loop over the other components, however many there are.</text></svg>
