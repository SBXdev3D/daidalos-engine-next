<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="746" viewBox="0 0 1400 746"><rect width="1400" height="746" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">Who owns what, then and now</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Assets and global services. One old idea survived: the path of a file is its identity.</text><text x="280" y="150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f2b84b" text-anchor="start">Old Daidalos</text><text x="840" y="150" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#3fb68b" text-anchor="start">Daidalos Engine Next</text><rect x="50" y="178" width="1300" height="78" rx="8" fill="#1f2430" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="224" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Finding the renderer</text><text x="280" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">IRenderer::GetRenderer(), a global</text><text x="280" y="237" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">99 calls in 32 source files</text><text x="840" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Passed in where it is needed</text><text x="840" y="237" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">you can see who uses it</text><rect x="50" y="266" width="1300" height="78" rx="8" fill="#191d28" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="312" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Global managers</text><text x="280" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">5 singletons</text><text x="280" y="325" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">resources, media, config, input, sound</text><text x="840" y="300" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">None of these</text><text x="840" y="325" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">logging stays global</text><rect x="50" y="354" width="1300" height="78" rx="8" fill="#1f2430" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="400" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Finding a loader</text><text x="280" y="388" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Registered by file extension</text><text x="280" y="413" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">at run time</text><text x="840" y="388" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Typed functions</text><text x="840" y="413" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">LoadModel, LoadImageFile</text><rect x="50" y="442" width="1300" height="78" rx="8" fill="#191d28" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="488" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Asset lifetime</text><text x="280" y="476" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Reference count per resource</text><text x="280" y="501" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">AddReference, Release, by hand</text><text x="840" y="476" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">AssetLibrary owns all of them</text><text x="840" y="501" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">released together with the scene</text><rect x="50" y="530" width="1300" height="78" rx="8" fill="#1f2430" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Using an asset</text><text x="280" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">A raw pointer</text><text x="840" y="564" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">A generational handle</text><text x="840" y="589" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">a stale one is detected</text><rect x="50" y="618" width="1300" height="78" rx="8" fill="#191d28" stroke="#262c3a" stroke-width="1.5"/><text x="72" y="664" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#eef1f6" text-anchor="start">Destroying GPU data</text><text x="280" y="652" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Immediate</text><text x="280" y="677" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">DirectX 9 tracks what the GPU uses</text><text x="840" y="652" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#eef1f6" text-anchor="start">Deferred</text><text x="840" y="677" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="start">until the GPU has finished with it</text></svg>
