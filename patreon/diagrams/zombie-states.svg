<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect width="1400" height="600" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">What a zombie does, 60 times per second</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Five states, and a straight line to the player: no path finding yet.</text><rect x="60" y="160" width="300" height="120" rx="10" fill="#1f2430" stroke="#6c7a94" stroke-width="2"/><text x="210.0" y="202" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Waiting</text><text x="210.0" y="234" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">stands still,</text><text x="210.0" y="258" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">then patrols if it has points</text><rect x="60" y="380" width="300" height="120" rx="10" fill="#1f2430" stroke="#6c7a94" stroke-width="2"/><text x="210.0" y="422" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Patrolling</text><text x="210.0" y="454" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">walks from point to point,</text><text x="210.0" y="478" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">6 s at each</text><rect x="560" y="270" width="300" height="120" rx="10" fill="#1f2430" stroke="#f2b84b" stroke-width="2"/><text x="710.0" y="312" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Chasing</text><text x="710.0" y="344" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">walks to where it last saw you,</text><text x="710.0" y="368" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">gives up after 9 s</text><rect x="1040" y="160" width="300" height="120" rx="10" fill="#1f2430" stroke="#ef7a6a" stroke-width="2"/><text x="1190.0" y="202" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Attacking</text><text x="1190.0" y="234" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">a strike every 1.5 s,</text><text x="1190.0" y="258" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">12 damage within 1.4 m</text><rect x="1040" y="380" width="300" height="120" rx="10" fill="#1f2430" stroke="#a3adbf" stroke-width="2"/><text x="1190.0" y="422" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#eef1f6" text-anchor="middle">Dying</text><text x="1190.0" y="454" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">falls where it stands,</text><text x="1190.0" y="478" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">no longer blocks the way</text><line x1="210" y1="282" x2="210" y2="378" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="362" y1="220" x2="558" y2="300" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><line x1="362" y1="440" x2="558" y2="360" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><text x="400" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef1f6" text-anchor="start">sees you or hears a shot</text><line x1="862" y1="300" x2="1038" y2="220" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><text x="870" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef1f6" text-anchor="start">close enough</text><line x1="1038" y1="250" x2="862" y2="320" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><line x1="862" y1="360" x2="1038" y2="440" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="700" y="470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#eef1f6" text-anchor="start">health at 0, from any state</text><rect x="50" y="530" width="1300" height="50" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="80" y="562" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a3adbf" text-anchor="start">Seeing is a ray from its eyes to yours: 12 m ahead, within 60° of where it faces, and nothing in between.</text></svg>
