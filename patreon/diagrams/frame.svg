<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><rect width="1400" height="640" fill="#14171f"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3adbf"/></marker></defs><text x="50" y="58" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#eef1f6" text-anchor="start">One frame, from the player&#x27;s hand to the screen</text><text x="50" y="90" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#a3adbf" text-anchor="start">Everything runs on the main thread. The GPU works in parallel, with up to two frames in flight.</text><rect x="50" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="148.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Events</text><text x="148.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">SDL3 events become</text><text x="148.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">engine events</text><line x1="248" y1="235" x2="274" y2="235" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="276" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="374.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Input</text><text x="374.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">held, pressed and</text><text x="374.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">released state</text><line x1="474" y1="235" x2="500" y2="235" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="502" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="600.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Update</text><text x="600.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">game logic edits</text><text x="600.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">ECS components</text><line x1="700" y1="235" x2="726" y2="235" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="728" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="826.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Propagate</text><text x="826.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">local transforms</text><text x="826.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">become world ones</text><line x1="926" y1="235" x2="952" y2="235" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="954" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#5aa2f0" stroke-width="2"/><text x="1052.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Extract</text><text x="1052.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">ECS is copied into</text><text x="1052.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">a SceneView</text><line x1="1152" y1="235" x2="1178" y2="235" stroke="#a3adbf" stroke-width="2" marker-end="url(#arrow)"/><rect x="1180" y="170" width="196" height="130" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="1278.0" y="214" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef1f6" text-anchor="middle">Render</text><text x="1278.0" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">SceneView becomes</text><text x="1278.0" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#a3adbf" text-anchor="middle">Vulkan commands</text><line x1="1052.0" y1="310" x2="1052.0" y2="366" stroke="#5aa2f0" stroke-width="2" stroke-dasharray="6 5"/><rect x="350" y="366" width="700" height="104" rx="10" fill="#17212f" stroke="#5aa2f0" stroke-width="1.5"/><text x="700" y="404" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="middle">The boundary that matters</text><text x="700" y="436" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="middle">The renderer never reads the ECS. It only sees a copy: a camera and a list of draws.</text><text x="700" y="458" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#a3adbf" text-anchor="middle">Gameplay can never reach into Vulkan, and Vulkan can never reach into gameplay.</text><rect x="50" y="510" width="1300" height="86" rx="10" fill="#1f2430" stroke="#3a4254" stroke-width="1.5"/><text x="80" y="545" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#eef1f6" text-anchor="start">GPU</text><text x="80" y="573" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#a3adbf" text-anchor="start">up to 2 frames in flight</text><rect x="480" y="527" width="390" height="52" rx="10" fill="#1a2030" stroke="#6c7a94" stroke-width="1.5"/><text x="675" y="559" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#eef1f6" text-anchor="middle">frame N-1: still running</text><rect x="900" y="527" width="390" height="52" rx="10" fill="#1a2030" stroke="#3fb68b" stroke-width="1.5"/><text x="1095" y="559" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#eef1f6" text-anchor="middle">frame N: just submitted</text></svg>
