# Settings of the Daidalos level editor, read after the engine's daidalos.cfg: "name value" per line,
# '#' starts a comment. The build copies this file next to editor.exe once, and leaves that copy alone
# afterwards: edit it there. Command-line arguments such as +editor.level Factory/EffectsRoom.level.json
# override it.

# The level file to open, under assets/.
editor.level Factory/Factory.level.json
# The editor shows the level as the game does, without the window filling the screen.
window.fullscreen false
