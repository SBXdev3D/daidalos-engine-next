# Settings of the Daidalos sandbox: "name value" per line, '#' starts a comment.
# The build copies this file next to sandbox.exe once, and leaves that copy alone afterwards: edit it there.
# Command-line arguments such as +renderer.exposure 1.2 override it. Unknown names are reported in the log.

# Window
window.width 1280
window.height 720

# Rendering
renderer.vsync true
# Multiplies the light before tonemapping.
renderer.exposure 1.0
# Anisotropic filtering of textures, from 1 (off) to 16. Read at startup.
renderer.anisotropy 16
# Relief of normal maps: 0 flattens them, 1 keeps them as authored. The factory's maps are subtle.
renderer.normal_strength 2.0
# Vulkan validation layers, on by default in debug builds. Read at startup.
# renderer.validation false

# Sound, from 0 to 1. Read at startup.
audio.volume 1.0
audio.effects 1.0
audio.music 1.0

# Game
# Radians per mouse unit.
sandbox.mouse 0.0025
# 1 is the factory's darkness, 0 lights the whole level evenly.
sandbox.darkness 1.0
# Light that reaches everywhere in the dark, far from any lamp. 0 is pitch black.
sandbox.ambient 0.1
# Start with the flashlight on, instead of finding it.
sandbox.flashlight false
# Where to start: "x y z yaw pitch", in meters and degrees. Empty starts at the level's start.
# sandbox.start "31.5 4.3 -54 0 -25"
