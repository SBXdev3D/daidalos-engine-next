# Settings of the Daidalos sandbox's game, read after the engine's daidalos.cfg: "name value" per line,
# '#' starts a comment. The engine's settings (window, rendering, sound, mouse) are in daidalos.cfg.
# The build copies this file next to sandbox.exe once, and leaves that copy alone afterwards: edit it
# there. Command-line arguments such as +sandbox.darkness 0.5 override it.

# 1 is the factory's darkness, 0 lights the whole level evenly.
sandbox.darkness 1.0
# Light that reaches everywhere in the dark, far from any lamp. 0 is pitch black.
sandbox.ambient 0.1
# Start with the flashlight on, instead of finding it.
sandbox.flashlight false
# Show the main menu at the start; false plays at once, for tests and screenshots.
sandbox.menu true
# Where to start: "x y z yaw pitch", in meters and degrees. Empty starts at the level's start.
# sandbox.start "31.5 4.3 -54 0 -25"
