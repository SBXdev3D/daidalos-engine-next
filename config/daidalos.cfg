# Settings of Daidalos Engine Next: "name value" per line, '#' starts a comment, and a value in double
# quotes keeps its spaces.
# The build copies this file next to each executable once, and leaves that copy alone afterwards: edit it
# there. A game may read a file of its own after this one, then the player's user.cfg, which the game's
# options write. Command-line arguments such as +renderer.exposure 1.2 override them all. Unknown names
# are reported in the log.
# The values below are the defaults: delete a line, or comment it out, to keep the default.

# Window
window.width 1280
window.height 720
# Cover the whole display, without borders, at its own resolution; the size above is for the window.
window.fullscreen false

# Rendering
renderer.vsync true
# Multiplies the light before tonemapping.
renderer.exposure 1.0
# Anisotropic filtering of textures, from 1 (off) to 16. Read at startup.
renderer.anisotropy 16
# Relief of normal maps: 0 flattens them, 1 keeps them as authored.
renderer.normal_strength 1.0
# Light that bounces off surfaces; off leaves direct light only.
renderer.indirect_light true
# Filters the noise of soft shadows and indirect light; off shows the light as the rays found it.
renderer.denoiser true
# Smoothing of jagged edges: taa, which blends each frame with the earlier ones, or off.
renderer.antialiasing taa
# Vulkan validation layers, on by default in debug builds. Read at startup.
# renderer.validation false
# With validation, also check that every pass waits for what it uses: slow. Read at startup.
# renderer.sync_validation false
# Debug view instead of the lit scene: off; rays, the scene as ray queries see it, one color per instance;
# path, the reference path tracer, which refines its image while the view stays still; or motion, the
# motion vectors of temporal antialiasing, grey where nothing moves.
# renderer.debug_view off
# The path tracer: surfaces a path meets at most (1 is direct light only), and paths per pixel to average.
# renderer.path_bounces 4
# renderer.path_samples 4096

# View
# Degrees across the screen, from 30 to 150. The height follows the window's shape.
view.fov 90
# Meters: nothing farther is drawn or lit.
view.distance 150

# Sound, from 0 to 1.
audio.volume 1.0
audio.effects 1.0
audio.music 1.0

# Input
# Radians of turn per mouse unit.
input.mouse_sensitivity 0.0025
