# Settings of Daidalos Engine Next: "name value" per line, '#' starts a comment, and a value in double
# quotes keeps its spaces.
# The build copies this file next to each executable once, and leaves that copy alone afterwards: edit it
# there. A game may read a file of its own after this one. Command-line arguments such as
# +renderer.exposure 1.2 override both. Unknown names are reported in the log.
# The values below are the defaults: delete a line, or comment it out, to keep the default.

# Window
window.width 1280
window.height 720

# Rendering
renderer.vsync true
# Multiplies the light before tonemapping.
renderer.exposure 1.0
# Anisotropic filtering of textures, from 1 (off) to 16. Read at startup.
renderer.anisotropy 16
# Relief of normal maps: 0 flattens them, 1 keeps them as authored.
renderer.normal_strength 1.0
# Darkens the ambient light in creases and corners.
renderer.ambient_occlusion true
# Vulkan validation layers, on by default in debug builds. Read at startup.
# renderer.validation false

# Sound, from 0 to 1. Read at startup.
audio.volume 1.0
audio.effects 1.0
audio.music 1.0

# Input
# Radians of turn per mouse unit.
input.mouse_sensitivity 0.0025
