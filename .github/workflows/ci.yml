name: CI

# One Linux job, on pull requests only: Windows is built and tested locally, and GitHub minutes are limited.
# Pull requests that only touch documentation or Patreon posts do not run it. It can also be started by hand.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "patreon/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Debug with AddressSanitizer and UBSan: asserts on, plus memory and undefined-behaviour checks.
    name: Linux Clang ASan
    runs-on: ubuntu-24.04
    env:
      # vcpkg binary cache, persisted between runs with actions/cache.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          pip install clang-format==19.1.5
          python3 scripts/format.py --check

      - name: Install build dependencies
        # Ninja, the X11 and Wayland development packages that SDL3 is built against, lavapipe with the
        # validation layers for the GPU tests, and a virtual display for the tests that need a window.
        # The engine needs Vulkan 1.4 with ray queries (ADR-0028), which lavapipe offers only in recent
        # Mesa releases: Mesa comes from the kisak PPA rather than from Ubuntu 24.04.
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config             libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev             libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev             mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb

      - name: Show what lavapipe supports
        run: |
          vulkaninfo --summary
          vulkaninfo | grep -E "VK_KHR_(acceleration_structure|ray_query|deferred_host_operations)" || true

      - name: Use the runner's vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-clang-asan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-clang-asan-

      - name: Configure
        run: cmake --preset linux-clang-asan

      - name: Build
        run: cmake --build --preset linux-clang-asan

      # Without -noreset, Xvfb resets when its last client leaves, and the next test finds no display.
      - name: Test on a virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24 -noreset" ctest --preset linux-clang-asan
